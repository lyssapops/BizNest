<!DOCTYPE html>
<html>
<head>

<title>Add Expense</title>

<style>

body{
    font-family:Arial;
    background:#f5f7fa;
    padding:40px;
}

.container{
    width:500px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
}

button{
    background:#2c7a4b;
    color:white;
    border:none;
    padding:12px 20px;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<h2>Add Expense</h2>

<form method="POST">

<input
type="text"
name="expense_name"
placeholder="Expense Name"
required>

<input
type="number"
step="0.01"
name="amount"
placeholder="Amount"
required>

<input
type="date"
name="expense_date"
required>

<input
type="text"
name="category"
placeholder="Category"
required>

<button type="submit">

Save Expense

</button>

</form>

<br>

<a href="/expenses">← Back</a>

</div>

</body>
</html>
