<!DOCTYPE html>
<html>
<head>
    <title>Edit Product | BizNest</title>

    <style>
        body{
            font-family:Arial;
            background:#f5f7fa;
            padding:40px;
        }

        .container{
            width:500px;
            margin:auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.1);
        }

        h2{
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            background:#2c7a4b;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:5px;
            cursor:pointer;
        }

        a{
            text-decoration:none;
            color:#2c7a4b;
        }
    </style>
</head>

<body>

<div class="container">

<h2>Edit Product</h2>

<form method="POST">

<input type="text" name="product_name" value="{{ product.product_name }}" required>

<input type="text" name="category" value="{{ product.category }}">

<input type="number" name="quantity" value="{{ product.quantity }}">

<input type="number" step="0.01" name="price" value="{{ product.price }}">

<button type="submit">Update Product</button>

</form>

<br>

<a href="/inventory">← Back to Inventory</a>

</div>

</body>
</html>
